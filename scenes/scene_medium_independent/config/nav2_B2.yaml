B2:
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: B2/base_footprint
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: map
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 100.0
      laser_min_range: -1.0
      laser_model_type: likelihood_field
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      odom_frame_id: B2/odom
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: nav2_amcl::DifferentialMotionModel
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.1
      update_min_d: 0.1
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      scan_topic: scan
      use_sim_time: true
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: B2/base_link
      odom_topic: /B2/odom
      bt_loop_duration: 10
      default_server_timeout: 2000
      wait_for_service_timeout: 1000
      action_server_result_timeout: 900.0
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      use_sim_time: true
  controller_server:
    ros__parameters:
      controller_frequency: 10.0
      costmap_update_timeout: 1.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      progress_checker_plugins:
      - progress_checker
      goal_checker_plugins:
      - goal_checker
      controller_plugins:
      - FollowPath
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.08
        yaw_goal_tolerance: 3.14
        stateful: false
      FollowPath:
        plugin: dwb_core::DWBLocalPlanner
        xy_goal_tolerance: 0.08
        debug_trajectory_details: false
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.26
        max_vel_y: 0.0
        max_vel_theta: 1.0
        min_speed_xy: 0.0
        max_speed_xy: 0.26
        min_speed_theta: 0.0
        acc_lim_x: 2.5
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        vx_samples: 10
        vy_samples: 1
        vtheta_samples: 15
        sim_time: 1.7
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        trans_stopped_velocity: 0.25
        short_circuit_trajectory_evaluation: true
        stateful: true
        critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        BaseObstacle.scale: 0.02
        PathAlign.scale: 0.0
        GoalAlign.scale: 0.0
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0
      use_sim_time: true
  local_costmap:
    local_costmap:
      ros__parameters:
        robot_base_frame: B2/base_link
        global_frame: B2/odom
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.22
        plugins:
        - voxel_layer
        - peer_layer
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        voxel_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          publish_voxel_map: false
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /B2/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            inf_is_valid: true
        peer_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: peer_scan
          peer_scan:
            topic: /B2/peer_scan
            data_type: LaserScan
            marking: true
            clearing: true
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            max_obstacle_height: 2.0
            inf_is_valid: true
        static_layer:
          map_subscribe_transient_local: true
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        robot_base_frame: B2/base_link
        robot_radius: 0.22
        plugins:
        - static_layer
        - obstacle_layer
        - peer_layer
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /B2/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            inf_is_valid: true
        peer_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: peer_scan
          peer_scan:
            topic: /B2/peer_scan
            data_type: LaserScan
            marking: true
            clearing: true
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            max_obstacle_height: 2.0
            inf_is_valid: true
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: true
  map_server:
    ros__parameters:
      yaml_filename: /home/zhuanz/projects/gongyu/evidence/phase97_cross_scene_setup/scene_medium_independent/maps/nav_calibration.yaml
      save_map_timeout: 5.0
      use_sim_time: true
  planner_server:
    ros__parameters:
      planner_plugins:
      - GridBased
      costmap_update_timeout: 1.0
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.0
        use_astar: false
        allow_unknown: true
      use_sim_time: true
  behavior_server:
    ros__parameters:
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      wait:
        plugin: nav2_behaviors::Wait
      global_frame: map
      local_frame: B2/odom
      robot_base_frame: B2/base_link
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
      use_sim_time: true
  collision_monitor:
    ros__parameters:
      base_frame_id: B2/base_footprint
      odom_frame_id: B2/odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 1.0
      base_shift_correction: true
      stop_pub_timeout: 2.0
      polygons:
      - FootprintApproach
      - PeerStop
      PeerStop:
        type: velocity_polygon
        action_type: stop
        min_points: 4
        visualize: false
        enabled: true
        holonomic: false
        velocity_polygons:
        - forward
        - backward
        - rotation
        - fallback
        forward:
          points: '[[0.0, 0.32], [0.38, 0.32], [0.38, -0.32], [0.0, -0.32]]'
          linear_min: 0.001
          linear_max: 0.6
          theta_min: -1.5
          theta_max: 1.5
        backward:
          points: '[[-0.0, 0.32], [-0.38, 0.32], [-0.38, -0.32], [-0.0, -0.32]]'
          linear_min: -0.6
          linear_max: -0.001
          theta_min: -1.5
          theta_max: 1.5
        rotation:
          points: '[[0.5, 0.0], [0.4903926402, 0.097545161], [0.4619397663, 0.1913417162],
            [0.4157348062, 0.2777851165], [0.3535533906, 0.3535533906], [0.2777851165,
            0.4157348062], [0.1913417162, 0.4619397663], [0.097545161, 0.4903926402],
            [0.0, 0.5], [-0.097545161, 0.4903926402], [-0.1913417162, 0.4619397663],
            [-0.2777851165, 0.4157348062], [-0.3535533906, 0.3535533906], [-0.4157348062,
            0.2777851165], [-0.4619397663, 0.1913417162], [-0.4903926402, 0.097545161],
            [-0.5, 0.0], [-0.4903926402, -0.097545161], [-0.4619397663, -0.1913417162],
            [-0.4157348062, -0.2777851165], [-0.3535533906, -0.3535533906], [-0.2777851165,
            -0.4157348062], [-0.1913417162, -0.4619397663], [-0.097545161, -0.4903926402],
            [-0.0, -0.5], [0.097545161, -0.4903926402], [0.1913417162, -0.4619397663],
            [0.2777851165, -0.4157348062], [0.3535533906, -0.3535533906], [0.4157348062,
            -0.2777851165], [0.4619397663, -0.1913417162], [0.4903926402, -0.097545161]]'
          linear_min: -0.001
          linear_max: 0.001
          theta_min: -1.5
          theta_max: 1.5
        fallback:
          points: '[[0.5, 0.0], [0.4903926402, 0.097545161], [0.4619397663, 0.1913417162],
            [0.4157348062, 0.2777851165], [0.3535533906, 0.3535533906], [0.2777851165,
            0.4157348062], [0.1913417162, 0.4619397663], [0.097545161, 0.4903926402],
            [0.0, 0.5], [-0.097545161, 0.4903926402], [-0.1913417162, 0.4619397663],
            [-0.2777851165, 0.4157348062], [-0.3535533906, 0.3535533906], [-0.4157348062,
            0.2777851165], [-0.4619397663, 0.1913417162], [-0.4903926402, 0.097545161],
            [-0.5, 0.0], [-0.4903926402, -0.097545161], [-0.4619397663, -0.1913417162],
            [-0.4157348062, -0.2777851165], [-0.3535533906, -0.3535533906], [-0.2777851165,
            -0.4157348062], [-0.1913417162, -0.4619397663], [-0.097545161, -0.4903926402],
            [-0.0, -0.5], [0.097545161, -0.4903926402], [0.1913417162, -0.4619397663],
            [0.2777851165, -0.4157348062], [0.3535533906, -0.3535533906], [0.4157348062,
            -0.2777851165], [0.4619397663, -0.1913417162], [0.4903926402, -0.097545161]]'
          linear_min: -1000.0
          linear_max: 1000.0
          theta_min: -1000.0
          theta_max: 1000.0
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: local_costmap/published_footprint
        time_before_collision: 2.0
        simulation_time_step: 0.1
        min_points: 6
        visualize: false
        enabled: true
      observation_sources:
      - scan
      - peer_scan
      peer_scan:
        type: scan
        topic: /B2/peer_scan
        min_height: 0.0
        max_height: 0.5
        enabled: true
      scan:
        type: scan
        topic: /B2/scan
        min_height: 0.15
        max_height: 2.0
        enabled: true
      use_sim_time: true
