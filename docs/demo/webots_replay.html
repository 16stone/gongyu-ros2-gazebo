<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共域 · Webots 整机同源回放</title>
<style>
:root{--bg:#070b14;--panel:rgba(16,25,42,.82);--line:rgba(120,180,230,.16);--txt:#dce9f7;--dim:#7f94ae;--blue:#45b8ff;--red:#ff7a6b;--gold:#ffcb5c;--green:#5be0a8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{background:radial-gradient(1200px 700px at 18% -10%,#122744 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#1b1738 0%,transparent 60%),var(--bg);overflow:hidden}
.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 22px 16px;max-width:1600px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;border:1px solid rgba(69,184,255,.5);border-radius:11px;display:grid;place-items:center;font-weight:800;color:var(--blue);box-shadow:0 0 22px rgba(69,184,255,.22) inset,0 0 18px rgba(69,184,255,.12)}
h1{font-size:19px;margin:0;letter-spacing:.06em;font-weight:650}h1 small{display:block;font-size:11px;color:var(--dim);letter-spacing:.12em;margin-top:3px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11px;color:var(--dim);backdrop-filter:blur(8px)}
.chip b{display:block;font-size:16px;color:var(--txt);font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.chip.gold b{color:var(--gold)}.chip.green b{color:var(--green)}
main{display:grid;grid-template-columns:1fr 310px;gap:14px;min-height:0}
.stage,.side{background:var(--panel);border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.stage{position:relative;overflow:hidden;min-height:0}
.stage canvas{width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 25%,transparent 78%,rgba(0,0,0,.28))}
.legend{position:absolute;left:16px;top:14px;display:flex;gap:14px;font-size:11px;color:var(--dim);z-index:2}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;box-shadow:0 0 10px currentColor}
.badge{position:absolute;right:16px;top:14px;z-index:2;font-size:10px;letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);padding:6px 9px;border-radius:7px;background:rgba(7,11,20,.55)}
.side{display:flex;flex-direction:column;min-height:0;padding:16px;gap:14px}
.side h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:0;text-transform:uppercase}
.chapters{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{font:inherit;color:var(--txt);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:11px;cursor:pointer;transition:.18s}
button:hover{border-color:rgba(69,184,255,.55);background:rgba(69,184,255,.1)}
button.on{border-color:var(--blue);color:#fff;background:rgba(69,184,255,.17);box-shadow:0 0 18px rgba(69,184,255,.15)}
.feed{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.ev{font-size:11px;line-height:1.45;padding:7px 9px;border-left:2px solid var(--blue);background:rgba(255,255,255,.025);border-radius:0 7px 7px 0;color:#b8cadd;animation:slide .25s ease}
.ev .t{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:7px}.ev.gold{border-color:var(--gold)}.ev.red{border-color:var(--red)}.ev.green{border-color:var(--green)}
@keyframes slide{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
footer{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:14px;border-color:rgba(69,184,255,.45);color:var(--blue)}
.timeline{flex:1;display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.clock{font-variant-numeric:tabular-nums;font-size:20px;letter-spacing:.05em;min-width:104px;text-align:right}
.clock small{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em}
@media(max-width:900px){main{grid-template-columns:1fr}.side{display:none}.wrap{padding:12px}}
</style>
</head>
